# Unit suites for the Python and Node stacks. The secret gate runs first:
# nothing is tested on a tree that carries key material. The `integration`
# tests need a validator, an IPFS node, a built program and an LLM endpoint,
# so they are excluded here and run on hosts that have them.
#
# Everything is pinned, and every job reads its own test count back out of the
# log and fails below a floor. A suite that collected nothing exits 0, and so
# does one that was quietly narrowed, so "the step was green" is not on its own
# evidence that the tests ran.
#
#   runs-on   ubuntu-24.04, not ubuntu-latest: GitHub moves the -latest label
#             between images (Ubuntu 26.04 is already published) and that would
#             land here unannounced.
#   actions   pinned to a commit. A tag can be moved to point anywhere.
#   uv, node  pinned to a version, not to a range.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.9"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.23.2"
  # Floors, not exact sizes: each is passed to scripts/ci/assert-test-count.sh
  # as `>=N`, so adding tests upstream cannot turn this repository red before
  # anyone here re-measures. An exact pin did exactly that on 2026-09-04: the
  # CLI suite had grown to 322 while this file still said 315, every test
  # passed, and the job failed on the number. A shortfall -- the failure the
  # count exists to catch, where a suite is silently narrowed or skips itself
  # and still exits 0 -- is rejected either way.
  #
  # These are the source tree's `CLI_MIN_TESTS`, `WORKER_MIN_TESTS` and
  # `NODE_MIN_TESTS` in `scripts/ci/pins.env`, which records how each was
  # measured. That file is not part of this export and a workflow `env:` block
  # cannot source one, so the values are copied here; the export's own test
  # suite fails if the copy and the declaration disagree.
  CLI_MIN_TESTS: "322"
  WORKER_MIN_TESTS: "151"
  NODE_MIN_TESTS: "44"

jobs:
  secrets:
    name: Key-material gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test the scanner
        run: scripts/check-no-secrets.sh --self-test
      - name: Scan the index
        run: scripts/check-no-secrets.sh

  cli:
    name: CLI unit tests
    needs: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        working-directory: cli
        run: uv sync --locked --group dev

      # The CLI hand-encodes every instruction and decodes every account, and
      # `tests/test_program_layout.py` asserts those encoders against the program
      # source. The program lives in its own repository, so check it out and put
      # `lib.rs` where the tests look for it; without this the layout tests skip
      # themselves and the encoders go unchecked.
      - name: Check out the program source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agent-k-ai/kswarm-protocol
          path: .kswarm-protocol
          persist-credentials: false
      - name: Place the program source
        run: |
          set -euo pipefail
          src=.kswarm-protocol/solana/programs/kswarm_protocol/src/lib.rs
          test -f "${src}"
          mkdir -p solana/programs/kswarm_protocol/src
          cp "${src}" solana/programs/kswarm_protocol/src/lib.rs

      # Encoder and account layouts asserted against the program source, Bonsol
      # binding vectors, run-manifest logic, command flows against a fake chain.
      #
      # The floor is the check that the layout tests actually ran: without the
      # program source placed above they skip themselves, and a skipped test is
      # not a passing one. That is 49 of them -- 273 passed and 49 skipped
      # instead of 322 passed -- which is far below the floor, so this step
      # fails rather than quietly shipping unchecked encoders.
      - name: Test
        working-directory: cli
        run: |
          set -euo pipefail
          uv run --locked pytest -q -m "not integration" 2>&1 | tee "${RUNNER_TEMP}/cli.log"
          ../scripts/ci/assert-test-count.sh pytest ">=${CLI_MIN_TESTS}" "${RUNNER_TEMP}/cli.log"

  worker:
    name: Worker unit tests
    needs: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        working-directory: worker
        run: uv sync --group dev
      # The daemons import `app.protocol.*` and `app.utils.llm_client` from the
      # vendored engine subset at the repository root; see NOTICE.
      - name: Test
        working-directory: worker
        run: |
          set -euo pipefail
          PYTHONPATH="${GITHUB_WORKSPACE}/backend" \
            uv run pytest -q -m "not integration" 2>&1 | tee "${RUNNER_TEMP}/worker.log"
          ../scripts/ci/assert-test-count.sh pytest ">=${WORKER_MIN_TESTS}" "${RUNNER_TEMP}/worker.log"

  node:
    name: Node control-plane tests
    needs: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # `--no-package-lock` is what `docker/protocol-node/Dockerfile` does, so the
      # tests run against the tree the image would install.
      - name: Install
        working-directory: protocol
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Syntax-check every module and script
        working-directory: protocol
        run: node --check src/*.mjs && node --check scripts/*.mjs
      # One directory and one glob, so this job and `npm test` cannot run
      # different halves of the suite.
      - name: Test
        working-directory: protocol
        run: |
          set -euo pipefail
          node --test "test/**/*.test.mjs" 2>&1 | tee "${RUNNER_TEMP}/node.log"
          ../scripts/ci/assert-test-count.sh node ">=${NODE_MIN_TESTS}" "${RUNNER_TEMP}/node.log"
