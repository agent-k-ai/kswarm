[project]
name = "kswarm-cli"
version = "0.1.0"
description = "Operator CLI for the kswarm Solana protocol"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "kswarm Team" }
]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "solana>=0.36.0",
    "solders>=0.23.0",
    "typer>=0.12.0",
]

[project.scripts]
kswarm = "kswarm_cli.main:main"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xprocess>=0.23.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kswarm_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs solana-test-validator and the built program artifact; excluded in CI with -m \"not integration\"",
]
