# The package name stays `mirofish_bonsol_branch_reducer` on purpose. This crate is the
# RISC Zero guest, and its package name reaches the loaded memory image: the crate name
# sits in the symbol and section tables, so its length moves `e_shoff` in the mapped ELF
# header, which `Program::load_elf` maps like any other PT_LOAD. Renaming the package
# therefore changes the image id. That id is pinned in `cli/kswarm_cli/reducer_image.py`
# as every aggregate job's `required_software_digest`, and it was recorded from live
# flagship demo runs. Changing it is a deliberate reducer version bump -- a real
# `bonsol build` through `protocol/scripts/run-bonsol-builder.sh` plus re-recorded demo
# transcripts -- not a side effect of a product rename.
[package]
name = "mirofish_bonsol_branch_reducer"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.zkprogram]
input_order = ["Public"]

[build]
target-dir = "./target"

[workspace]

[dependencies]
gjson = "0.8"
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["std"] }
sha2 = "0.10"

[dev-dependencies]
proptest = "1.6"
